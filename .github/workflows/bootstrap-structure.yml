name: Complete IA A structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-structure.yml'

permissions:
  contents: write

jobs:
  complete-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore official browser-core and icons
        shell: bash
        run: |
          cat > /tmp/iaa_payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/iaa_payload.b64 > /tmp/iaa_payload.tar.xz
          xz -d -c /tmp/iaa_payload.tar.xz | tar -xf -
          rm -f .github/workflows/bootstrap-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-core icons .github/workflows/bootstrap-structure.yml
          git commit -m 'Complete browser-core and icons [skip ci]'
          git push
