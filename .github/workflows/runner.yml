name: Run IA A structure completion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete official structure
        shell: bash
        run: |
          awk '/^NzjFA3bEuyIFZrbUzsfchObTx/{flag=1} /^PAYLOAD$/{if(flag){exit}} flag{print}' .github/workflows/bootstrap-structure.yml > /tmp/iaa_payload.b64
          base64 -d /tmp/iaa_payload.b64 > /tmp/iaa_payload.tar.xz
          xz -d -c /tmp/iaa_payload.tar.xz | tar -xf -
          rm -f .github/workflows/bootstrap-structure.yml .github/workflows/runner.yml .iaa-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete browser-core and icons [skip ci]'
          git push
