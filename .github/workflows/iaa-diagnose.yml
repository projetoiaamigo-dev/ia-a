name: Diagnose IA A payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          cat .iaa-payload/chunk*.txt > /tmp/iaa_payload.b64
          base64 -d /tmp/iaa_payload.b64 > /tmp/iaa_payload.tar.gz
          rc=$?
          bytes=$(wc -c < /tmp/iaa_payload.b64)
          sha=$(sha256sum /tmp/iaa_payload.tar.gz | awk '{print $1}')
          count=$(tar -tzf /tmp/iaa_payload.tar.gz 2>/dev/null | wc -l)
          printf 'decode_rc=%s\nbase64_bytes=%s\nsha256=%s\ntar_entries=%s\n' "$rc" "$bytes" "$sha" "$count" > .iaa-diag
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .iaa-diag
          git commit -m 'IA A payload diagnostic [skip ci]' || exit 0
          git push
