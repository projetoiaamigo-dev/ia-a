name: Restore official IA A structure

on:
  push:
    branches: [main]
    paths:
      - '.iaa-trigger-final'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact package structure
        shell: bash
        run: |
          cat .iaa-payload/chunk*.txt > /tmp/iaa_payload.b64
          base64 -d /tmp/iaa_payload.b64 > /tmp/iaa_payload.tar.gz
          tar -xzf /tmp/iaa_payload.tar.gz
          test "$(find browser-core -maxdepth 1 -type f | wc -l)" -eq 18
          test -f icons/ia-a.svg
          rm -rf .iaa-payload .iaa
          rm -f .iaa-trigger-final .iaa-action-ok
          rm -f .github/workflows/iaa-test.yml
          rm -f .github/workflows/iaa-restore-official.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore exact official browser-core and icons [skip ci]'
          git push
