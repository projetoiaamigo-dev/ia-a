name: Restore official IA A structure

on:
  push:
    branches: [main]
    paths:
      - '.iaa-trigger-final'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact package structure
        shell: bash
        run: |
          cat .iaa-payload/chunk01.txt .iaa-payload/chunk02.txt .iaa-payload/chunk03.txt .iaa-payload/chunk04.txt .iaa-payload/chunk05.txt .iaa-payload/chunk06.txt .iaa-payload/chunk07.txt .iaa-payload/chunk08.txt .iaa-payload/chunk09a.txt .iaa-payload/chunk09b.txt .iaa-payload/chunk10.txt .iaa-payload/chunk11.txt .iaa-payload/chunk12.txt > /tmp/iaa_payload.b64
          test "$(wc -c < /tmp/iaa_payload.b64)" -eq 91556
          base64 -d /tmp/iaa_payload.b64 > /tmp/iaa_payload.tar.gz
          test "$(sha256sum /tmp/iaa_payload.tar.gz | awk '{print $1}')" = "39a31772e56dc5f3866f2188ed314476d48abd6c2041b8924d2457a12d1e9f00"
          tar -xzf /tmp/iaa_payload.tar.gz
          test "$(find browser-core -maxdepth 1 -type f | wc -l)" -eq 18
          test -f icons/ia-a.svg
          rm -rf .iaa-payload .iaa
          rm -f .iaa-trigger-final .iaa-action-ok .iaa-diag
          rm -f .github/workflows/iaa-test.yml .github/workflows/iaa-diagnose.yml .github/workflows/iaa-restore-official.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore exact official browser-core and icons [skip ci]'
          git push
